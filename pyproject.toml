[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "egit"
version = "0.0.1"
description = "Git with gocryptfs-based encrypted backend"
readme = "README.md"
authors = [{name = "Dan Roche"}]
requires-python = ">=3.12"

[project.scripts]
egit = "egit.egit:main"
locksync = "egit.locksync:main"
